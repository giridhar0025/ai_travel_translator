name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: translator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Settings reads DATABASE_URL; conftest copies TEST_DATABASE_URL into it
      # before importing app.config, so .env in the repo is irrelevant in CI.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/translator_test
      APP_JWT_SECRET: ci-secret-not-used-outside-tests
      # Firebase verifier is mocked in every auth test; an empty service-account
      # blob keeps firebase_admin's lazy init from firing during import.
      FIREBASE_SERVICE_ACCOUNT_JSON: ''
      HF_API_TOKEN: ''

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install deps
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Black
        working-directory: backend
        run: uv run black --check .

      - name: Migrate test DB
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Seed languages + phrases
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: uv run python -m scripts.seed_phrases

      - name: Pytest with coverage
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Upload coverage XML
        if: always()
        working-directory: backend
        run: uv run coverage xml -o coverage.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
