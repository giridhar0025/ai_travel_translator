name: TravelTranslator
options:
  bundleIdPrefix: com.divami
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TravelTranslator:
    type: application
    platform: iOS
    sources:
      - path: TravelTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divami.traveltranslator
        INFOPLIST_FILE: TravelTranslator/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
    preBuildScripts:
      - name: Generate Design Tokens
        script: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd "$SRCROOT/.."
          TOKENS_IOS_OUT="$SRCROOT/TravelTranslator/DesignSystem/Tokens.swift" \
            node tools/gen-tokens.mjs

schemes:
  TravelTranslator:
    build:
      targets:
        TravelTranslator: all
    run:
      config: Debug
